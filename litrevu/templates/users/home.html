{% extends "base.html" %}

{% block title %}Accueil - LITRevu{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-6 mb-4">
        <h2>Inscrivez-vous maintenant</h2>
        <a href="{{ url('signup') }}" class="btn btn-outline-primary">S'inscrire</a>
    </div>

    <div class="col-md-6">
        <h2>Connectez-vous</h2>
        <form method="post" novalidate>
            {{ csrf_input }}
            <div class="mb-3">
                <label for="{{ form.username.id_for_label }}" class="form-label">Nom d'utilisateur</label>
                {{ form.username }}
            </div>
            <div class="mb-3">
                <label for="{{ form.password.id_for_label }}" class="form-label">Mot de passe</label>
                {{ form.password }}
            </div>
            <button type="submit" class="btn btn-primary">Se connecter</button>
        </form>
    </div>
</div>
{% endblock %}
